<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lecture Slides</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="slides">
    <!-- Slides loaded dynamically -->
  </div>

  <div class="nav">
    <button id="prev">← Prev</button>
    <span id="counter">1 / ?</span>
    <button id="next">Next →</button>
    <button id="bigger-text">Bigger Text</button>
    <button id="smaller-text">Smaller Text</button>
    <button id="print">🖨️ Print PDF</button>
    <button class="annotation-toggle" id="annotationToggle">
      <span class="toggle-icon">👁️</span>
      <span class="toggle-text">Hide Annotations</span>
    </button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
  <script src="core.js"></script>
  <script src="animations.js"></script>
  <script src="containers.js"></script>
  <script>
    // Load sections in order
    loadSections(['title', 'containers', 'functions', 'file-io']);
  </script>
</body>
</html>
